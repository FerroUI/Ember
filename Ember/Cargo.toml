[package]
name = "ember"
description = "Ember: an adaptive, offline-capable Hacker News reader using FerroUI and its WinUI 3 theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
ember-core = { path = "../Ember.Core" }
ember-content = { path = "../Ember.Content" }
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-winui = { workspace = true }
sample-support = { path = "../FerroUI/samples/SampleSupport" }

[build-dependencies]
sample-build = { path = "../FerroUI/samples/SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../FerroUI/samples/SampleTesting" }
serde_json = "1"
