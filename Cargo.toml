[workspace]
resolver = "2"
members = [
    "Ember.Core",
    "Ember.Content",
    "Ember",
    "Ember.Desktop",
    "Ember.Browser",
    "Ember.Android",
    "Ember.iOS",
]
# The framework crates belong to the workspace of the submodule (FerroUI/docs/apps.md).
exclude = ["FerroUI"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/FerroUI/Ember"

[workspace.dependencies]
