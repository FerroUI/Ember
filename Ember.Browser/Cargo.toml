[package]
name = "ember-browser"
description = "The WebAssembly host of Ember with browser fetch and transactional IndexedDB storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[[bin]]
name = "ember-browser"
path = "program.rs"

[features]
default = []
vello = ["ferroui-browser/vello"]

[dependencies]
ember = { path = "../Ember" }
ember-core = { path = "../Ember.Core", default-features = false }
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-browser = { workspace = true }
ferroui-fonts-inter = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde_json = "1"
url = { workspace = true }

[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
ferroui-skia = { workspace = true }
