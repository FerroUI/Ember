<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#D95B32">
    <meta name="description" content="Ember is a thoughtful, touch-friendly Hacker News reader built with FerroUI.">
    <title>Ember — Hacker News</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <main id="out" aria-label="Ember Hacker News reader">

    <script type="module" src="./main.js"></script>
