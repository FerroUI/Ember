[package]
name = "ember-ios"
description = "The iOS host of Ember, the FerroUI Hacker News reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[[bin]]
name = "ember-ios"
path = "main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
ember = { path = "../Ember" }
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-ios = { workspace = true }
ferroui-fonts-inter = { workspace = true }
